name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  GOTOOLCHAIN: auto
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/baldr-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/baldr-frontend

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devsecops
          POSTGRES_PASSWORD: devsecops
          POSTGRES_DB: devsecops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsecops -d devsecops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://devsecops:devsecops@localhost:5432/devsecops?sslmode=disable
        run: go test -tags integration -count=1 ./internal/api/routes/...

      - name: Vet
        run: go vet ./...

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: node_modules/.bin/tsc --noEmit

      - name: Test
        run: npm test -- --run

  docker:
    name: Docker (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha,scope=baldr-backend
          cache-to: type=gha,mode=max,scope=baldr-backend
          provenance: true

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha,scope=baldr-frontend
          cache-to: type=gha,mode=max,scope=baldr-frontend
          provenance: true

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - uses: sigstore/cosign-installer@v3.8.0

      - name: Sign backend image
        run: cosign sign --yes "${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}"

      - name: Sign frontend image
        run: cosign sign --yes "${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}"

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json

      - name: Upload SBOMs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
